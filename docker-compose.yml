version: '3.8'

services:
  web:
    build: .
    container_name: inventario_euridice
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Euridice123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ./data:/app/data
      - ./https:/https:ro
      - ./Productos_Migrados.csv:/app/Productos_Migrados.csv:ro
      - ./ExistenciaAlmacen_Migrado.csv:/app/ExistenciaAlmacen_Migrado.csv:ro
