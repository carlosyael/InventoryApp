version: '3.8'

services:
  web:
    build: .
    container_name: inventario_euridice
    restart: always
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DB_DIR=/app/data
    volumes:
      - euridice_db_data:/app/data
      - ./Productos_Migrados.csv:/app/Productos_Migrados.csv:ro
      - ./ExistenciaAlmacen_Migrado.csv:/app/ExistenciaAlmacen_Migrado.csv:ro

volumes:
  euridice_db_data:
    name: euridice_inventario_data
