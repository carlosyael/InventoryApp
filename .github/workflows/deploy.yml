name: Deploy to Local Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # Corre en tu servidor local 192.168.68.16

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build and deploy with Docker
        run: |
          docker compose up -d --build --remove-orphans
          echo "✅ Deployment complete!"

      - name: Show container status
        run: docker ps --filter "name=inventario_euridice"
