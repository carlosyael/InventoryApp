name: Deploy to Local Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /home/localserver/inventario

            # Pull latest code
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/carlosyael/InventoryApp.git .
            fi

            # Generate HTTPS cert if missing
            if [ ! -f "https/aspnetapp.pfx" ]; then
              mkdir -p https
              openssl req -x509 -newkey rsa:4096 \
                -keyout https/key.pem -out https/cert.pem \
                -sha256 -days 365 -nodes \
                -subj "/CN=192.168.68.16"
              openssl pkcs12 -export \
                -out https/aspnetapp.pfx \
                -inkey https/key.pem -in https/cert.pem \
                -passout pass:Euridice123!
            fi

            # Create data dir for SQLite persistence
            mkdir -p data

            # Build and restart containers
            docker compose down
            docker compose up -d --build

            echo "✅ Deployment complete!"
